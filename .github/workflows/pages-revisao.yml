name: Publicar revisão dos guias
on:
  push:
    branches: [man]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF==1.26.6' 'pypdf>=6,<7' 'Pillow>=11,<13'
      - name: Gerar somente o guia APPCC de revisão
        run: python -u appcc-desenvolvimento/tools/build_indicators.py
      - name: Conferir JavaScript da revisão
        run: |
          node --check appcc-desenvolvimento/config.js
          node --check appcc-desenvolvimento/app.js
          node --check appcc-desenvolvimento/paper.js
          node --check appcc-desenvolvimento/storage-separation.js
          node --check appcc-desenvolvimento/tools/indicator_editor.js
          node --check appcc-desenvolvimento/tools/indicator_pdf.js
          node appcc-desenvolvimento/tools/test_indicator_editor.cjs
          node appcc-desenvolvimento/tools/test_responsibility.cjs
          node appcc-desenvolvimento/tools/test_capture_supplement.cjs
          node appcc-desenvolvimento/tools/test_numbering.cjs
      - name: Preservar todas as páginas existentes e preparar a revisão
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('.', '_site', ignore=shutil.ignore_patterns('.git','.github','_site','.build','__pycache__','tools'))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
