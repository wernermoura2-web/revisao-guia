name: Publicar revisão dos guias
on:
  push:
    branches: [man]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF==1.26.6' 'pypdf>=6,<7' 'Pillow>=11,<13'
      - name: Gerar somente o guia APPCC de revisão
        run: python -u appcc-desenvolvimento/tools/build_indicators.py
      - name: Conferir JavaScript da revisão
        run: |
          node --check appcc-desenvolvimento/config.js
          node --check appcc-desenvolvimento/app.js
          node --check appcc-desenvolvimento/paper.js
          node --check appcc-desenvolvimento/storage-separation.js
          node --check appcc-desenvolvimento/tools/indicator_editor.js
          node --check appcc-desenvolvimento/tools/indicator_pdf.js
          node appcc-desenvolvimento/tools/test_indicator_editor.cjs
          node appcc-desenvolvimento/tools/test_responsibility.cjs
          node appcc-desenvolvimento/tools/test_capture_supplement.cjs
          node appcc-desenvolvimento/tools/test_numbering.cjs
          node appcc-desenvolvimento/tools/test_capture_merge.cjs
          node appcc-desenvolvimento/tools/test_conduction.cjs
          node appcc-desenvolvimento/tools/test_reservoirs.cjs
          node appcc-desenvolvimento/tools/test_paper_runtime.cjs
          node appcc-desenvolvimento/tools/test_capture_classification.cjs
          node appcc-desenvolvimento/tools/test_reception.cjs
          node appcc-desenvolvimento/tools/test_inspector_guidance.cjs
      - name: Preservar todas as páginas existentes e preparar a revisão
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree('.', '_site', ignore=shutil.ignore_patterns('.git','.github','_site','.build','__pycache__','tools'))
          PY
      - name: Empacotar interface e imagens da mesma versão
        run: python appcc-desenvolvimento/tools/package_runtime.py --site-root _site/appcc-desenvolvimento
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Aguardar publicação automática da mesma revisão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u - <<'PYWAIT'
          import json, os, time, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=100'
          for attempt in range(19):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)['workflow_runs']
              pending = [run for run in runs if run['id'] != int(os.environ['GITHUB_RUN_ID']) and run['name'] == 'pages build and deployment' and run['status'] != 'completed']
              if not pending:
                  print('Publicação automática concluída; publicar agora o PDF e as páginas gerados.')
                  break
              if attempt == 18:
                  raise SystemExit('Publicação automática ainda em execução; não disputar a implantação.')
              print('Aguardando publicação automática para evitar sobrescrita do PDF gerado.')
              time.sleep(10)
          PYWAIT
      - uses: actions/deploy-pages@v4
        id: deployment
